# Copy this file to config/pico.local.yaml and fill in local-only values.
# Do not commit config/pico.local.yaml.
pico:
  model:
    provider: openai-codex
    id: gpt-5.6-sol
    thinkingLevel: medium

session:
  enabled: true
  ending:
    mode: timed
    durationMs: 60000

telemetry:
  otel:
    enabled: false
    baseUrl: http://127.0.0.1:4318
    serviceName: pico
    timeoutMs: 10000
    metricExportIntervalMs: 15000
    shutdownTimeoutMs: 5000

camera:
  stackchan:
    sourceId: stackchan-core-s3
    # stackchan-mcp local gateway. Put the token value in STACKCHAN_TOKEN;
    # never place the token itself in this YAML.
    mcpUrl: http://127.0.0.1:18767/mcp
    bearerTokenEnv: STACKCHAN_TOKEN
    timeoutMs: 10000
    maxFrameBytes: 5242880
    streamFps: 20
    streamJpegQuality: 60
    follow:
      enabled: false
      commandTransport: async-latest
      commandRateHz: 10
      maxPendingCommandAgeMs: 180
      frameIntervalMs: 125
      maxFrameAgeMs: 180
      # Optical home is intentionally pitched down from the mechanical center.
      homeYaw: 0
      homePitch: 35
      deadZone: 0.10
      deadZoneRelease: 0.14
      stepQuantization: round
      targetFilter:
        enabled: false
      yawGainDeg: 40
      pitchGainDeg: 30
      flipYaw: 1
      flipPitch: -1
      maxStepDeg: 4
      moveSpeedDps: 90
      lostHoldMs: 1000
      scanDwellMs: 900
      scanYaw: [-35, 0, 35]
      scanPitch: [35, 25]
  tapo:
    sourceId: tapo-rtsp
    host: 192.168.10.25
    user: your-camera-user
    password: your-camera-password
    # Optional runtime defaults: port=554, onvifPort=2020.
    streams:
      # VLM scene understanding uses the high-quality stream by default.
      scene: stream1
      # Person detection/follow uses the lower-cost stream by default.
      detection: stream2
  personFollow:
    enabled: false
    sourceCameraId: tapo-rtsp
    deadZone: 0.1
    maxStep: 0.25
    speed: 0.4
    cooldownMs: 500
    lostTargetTimeoutMs: 1500

vision:
  # The current Pi/Codex model receives one bounded image as tool content.
  # Use provider=ollama to retain the protected Windows Ollama route instead.
  sceneDescription:
    provider: agent
    source: stackchan
    timeoutMs: 30000
    maxImageEdgePixels: 512
  ollama:
    # This must be a pico-host loopback URL served by a protected SSH local
    # forward to Windows native Ollama on the vision host, not a direct
    # Windows, LAN, tailnet, WSL, or public Ollama URL.
    # Example:
    # ssh -N -o ExitOnForwardFailure=yes \
    #   -L 127.0.0.1:11435:127.0.0.1:11434 pico-vision-host
    localBaseUrl: http://127.0.0.1:11435
    maxImageEdgePixels: 512
    # Optional defaults: endpointId=windows-ollama-qwen3-5,
    # tunnel.kind=tailscale_ssh, tunnel.sshTarget=pico-vision-host.
  personDetection:
    enabled: false
    sourceCameraId: tapo-rtsp
    modelFamily: pinto0309
    # Local providers: onnxruntime, tflite, or openvino.
    provider: onnxruntime
    modelPath: /opt/pico/models/pinto0309/yolox_nano_person.onnx
    inputWidth: 320
    inputHeight: 320
    # Output layouts: xyxy_score_class or cxcywh_score_class.
    outputLayout: xyxy_score_class
    # Coordinate scales: pixel or normalized.
    coordinateScale: pixel
    frameIntervalMs: 500
    confidenceThreshold: 0.55
  attentionDetection:
    enabled: false
    provider: onnxruntime
    modelFamily: pinto441-yolox-body-head-hand-face-dist
    modelPath: /opt/pico/models/pinto441/yolox_s_body_head_hand_face_dist_0189_0.4952_post_1x3x256x320.onnx
    inputWidth: 320
    inputHeight: 256
    headConfidenceThreshold: 0.35
    faceConfidenceThreshold: 0.4

voice:
  resident:
    enabled: false
    # Mac mini resident runtime:
    audioInput:
      provider: avaudioengine
      deviceUid: BuiltInMicrophoneDevice
    audioOutput:
      provider: ffplay
      route: system_default
    # Raspberry Pi / Linux resident runtime:
    # audioInput:
    #   provider: alsa
    #   device: hw:1,0
    # audioOutput:
    #   provider: alsa
    #   device: hw:0,0
    singleInstanceLockPath: tmp/pico-voice-resident.lock
    shutdownGraceMs: 5000
    control:
      provider: macos_resident_io
      keyboard:
        provider: macos
        # Examples only. Both bindings are required and may be changed.
        talkKey: F13
        cancelKey: F14
    vad:
      provider: energy
      minRmsDb: -55
      # provider: ten_vad
      # jsPath: vendors/ten-vad/ten_vad.js
      # wasmPath: vendors/ten-vad/ten_vad.wasm
      # hopSize: 160
      # threshold: 0.5
  probes:
    enabled: true
  echoControl:
    enabled: false
    mode: aec
    provider: web_rtc_aec3
    providerEndpoint: http://127.0.0.1:8770
    sampleRateHz: 16000
    channels: 1
    frameMs: 10
    tailMuteMs: 700
    diagnostics:
      enabled: true
  stt:
    appleSpeech:
      localBaseUrl: http://127.0.0.1:8766
      samplePcm16lePath: /tmp/pico-known-ja.pcm
      # Optional defaults: id=local-apple-speech, language=ja-JP,
      # timeoutMs=30000, warmupAudioSeconds=0.25, sampleRateHz=16000, channels=1.
      # samplePcm16lePath is only required by the provider smoke command.
  tts:
    provider: irodori
    irodori:
      id: windows-irodori-voicedesign
      localBaseUrl: http://127.0.0.1:18923
      speaker: カスミ
      style: calm
      numSteps: 30
      seed: 42
      # Optional default text: こんにちは。picoの音声スモークです。
    # Explicit rollback provider; unused while provider is irodori.
    aivis:
      localBaseUrl: http://127.0.0.1:10101
      speakerId: 888753760
